name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: Tests and scorer regression
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements*.txt

      - name: Install dependencies
        run: pip install -r requirements-evals.txt

      - name: Unit tests
        run: python -m pytest -q

      # Scores the held-out benchmark with the committed model files and fails the build if
      # macro-F1 drops below the threshold (local value: 0.399).
      - name: Scorer regression check
        run: python evals/check_regression.py --min-macro-f1 0.37

  docker:
    name: Docker build and smoke test
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4

      - name: Build image
        run: docker build -t resumelab .

      - name: Start container and wait for health
        run: |
          docker run -d --name resumelab -p 8501:8501 resumelab
          for i in $(seq 1 30); do
            if curl -fs http://localhost:8501/_stcore/health; then echo " healthy"; exit 0; fi
            sleep 2
          done
          docker logs resumelab
          exit 1

      - name: Show container logs on failure
        if: failure()
        run: docker logs resumelab
